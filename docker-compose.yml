services:
  streamlit_app:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - webhook_server

  webhook_server:
    build: ./webhook_server
    ports:
      - "8000:8000"
    volumes:
      - ./shared/uploads:/app/shared/uploads  
