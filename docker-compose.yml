version: "3.9"

services:

  rai_frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - rai_backend
    networks:
      - lang_net


  rai_backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: rai.settings.production
    networks:
      lang_net:
        aliases:
          - requirementsai-backend-service


  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: rai
      POSTGRES_USER: rai
      POSTGRES_PASSWORD: rai123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lang_net


volumes:
  postgres_data:


networks:
  lang_net:
    driver: bridge
