version: '3.9'
services:

  streamlit_app:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - webhook_server
    networks:
      - lang_net

  webhook_server:
    build: ./webhook_server
    ports:
      - "8001:8001"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    networks:
      - lang_net
      
networks:
  lang_net:
    driver: bridge
