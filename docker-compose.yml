services:

  rai_frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - rai_backend
    networks:
      - lang_net

  rai_backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - db
      - redis
    networks:
      lang_net:
        aliases:
          - requirementsai-backend-service

  celery_worker:
    build: ./backend
    env_file:
      - ./backend/.env
    entrypoint: []  
    command: celery -A rai worker -l info
    volumes:
      - ./shared/uploads:/app/shared/uploads
    depends_on:
      - db
      - redis
    networks:
      - lang_net

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lang_net

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: rai
      POSTGRES_USER: rai
      POSTGRES_PASSWORD: rai123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lang_net

volumes:
  postgres_data:

networks:
  lang_net:
    driver: bridge