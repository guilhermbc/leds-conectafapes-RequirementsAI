name: Requirements AI CI/CD

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: write
  packages: write

concurrency:
  group: requirements-ai-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  IMAGE_FRONTEND: ghcr.io/leds-conectafapes/leds-conectafapes-requirementsai-frontend
  IMAGE_BACKEND: ghcr.io/leds-conectafapes/leds-conectafapes-requirementsai-backend
  INFRA_REPO: leds-conectafapes/leds-conectafapes-infra
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Pre-clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/.??* "$GITHUB_WORKSPACE"/* || true

      - uses: actions/checkout@v4

      - name: Preflight Docker
        run: docker info

      - name: Fix workspace permissions
        if: always()
        run: sudo chown -R $USER:$USER "$GITHUB_WORKSPACE" || true

  publish:
    name: Publish (GHCR)
    runs-on: [self-hosted, linux, x64]
    needs: build

    outputs:
      frontend_digest: ${{ steps.digest.outputs.frontend_digest }}
      backend_digest: ${{ steps.digest.outputs.backend_digest }}

    steps:
      - name: Pre-clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/.??* "$GITHUB_WORKSPACE"/* || true

      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Sanitize Branch Name
        run: |
          SAFE_BRANCH=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
          echo "SAFE_BRANCH=${SAFE_BRANCH}" >> $GITHUB_ENV    

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

    # --- BUILD DO FRONTEND ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ env.SAFE_BRANCH }}

      # --- BUILD DO BACKEND ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend  
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ env.SAFE_BRANCH }}

      - name: Resolve image digests
        id: digest
        run: |
          DIGEST_FRONTEND=$(docker buildx imagetools inspect ${{ env.IMAGE_FRONTEND }}:${{ env.SAFE_BRANCH }} | awk '/Digest:/ { print $2; exit }')
          DIGEST_BACKEND=$(docker buildx imagetools inspect ${{ env.IMAGE_BACKEND }}:${{ env.SAFE_BRANCH }} | awk '/Digest:/ { print $2; exit }')
          
          echo "frontend_digest=${DIGEST_FRONTEND}" >> $GITHUB_OUTPUT
          echo "backend_digest=${DIGEST_BACKEND}" >> $GITHUB_OUTPUT

      - name: Fix workspace permissions
        if: always()
        run: sudo chown -R $USER:$USER "$GITHUB_WORKSPACE" || true

  deploy:
    name: Deploy (Infra repo)
    runs-on: [self-hosted, linux, x64]
    needs: publish
    
    
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')

    container:
      image: alpine/git
      env:
        BRANCH_NAME: ${{ env.BRANCH_NAME }}

    steps:
      - name: Determine target path
        id: envpath
        run: |
          case "${BRANCH_NAME}" in
            develop) ENV_PATH="agentes/stage/Requirements-AI" ;;
            *) echo "Branch não mapeada"; exit 1 ;;
          esac

          echo "env_path=${ENV_PATH}" >> $GITHUB_OUTPUT
          echo "target_branch=develop" >> $GITHUB_OUTPUT 

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_PUSH_TOKEN }}
          ref: ${{ steps.envpath.outputs.target_branch }}
          path: infra

      - name: Update deployment.yaml
        working-directory: infra/${{ steps.envpath.outputs.env_path }}
        env:
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
        run: |
          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE_FRONTEND}@${FRONTEND_DIGEST}|" frontend/deployment.yaml

          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE_BACKEND}@${BACKEND_DIGEST}|" backend/deployment.yaml

      - name: Commit and push changes
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "[DEPLOY] Requirements AI atualizado para ${BRANCH_NAME}" || echo "Nenhuma mudança"
          git push origin ${{ steps.envpath.outputs.target_branch }}