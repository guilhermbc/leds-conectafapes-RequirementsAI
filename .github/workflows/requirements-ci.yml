name: Requirements AI CI/CD

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: write
  packages: write

concurrency:
  group: requirements-ai-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  IMAGE_APP: ghcr.io/leds-conectafapes/leds-conectafapes-requirementsai
  IMAGE_HOOK: ghcr.io/leds-conectafapes/leds-conectafapes-requirementsai-hook
  INFRA_REPO: leds-conectafapes/leds-conectafapes-infra
  BRANCH_NAME: ${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Pre-clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/.??* "$GITHUB_WORKSPACE"/* || true

      - uses: actions/checkout@v4

      - name: Preflight Docker
        run: docker info

      - name: Build Streamlit App (sanity check)
        working-directory: streamlit_app
        run: docker build -t app-temp:${BRANCH_NAME} -f dockerfile .

      - name: Build Webhook Server (sanity check)
        working-directory: webhook_server  
        run: docker build -t hook-temp:${BRANCH_NAME} -f dockerfile .

      - name: Fix workspace permissions
        if: always()
        run: sudo chown -R $USER:$USER "$GITHUB_WORKSPACE" || true



  publish:
    name: Publish (GHCR)
    runs-on: [self-hosted, linux, x64]
    needs: build

    outputs:
      app_digest: ${{ steps.digest.outputs.app_digest }}
      hook_digest: ${{ steps.digest.outputs.hook_digest }}

    steps:
      - name: Pre-clean workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/.??* "$GITHUB_WORKSPACE"/* || true

      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Streamlit App
        uses: docker/build-push-action@v6
        with:
          context: ./streamlit_app
          file: ./streamlit_app/dockerfile
          push: true
          tags: ${{ env.IMAGE_APP }}:${{ env.BRANCH_NAME }}

      - name: Build & Push Webhook Server
        uses: docker/build-push-action@v6
        with:
          context: ./webhook_server  
          file: ./webhook_server/dockerfile
          push: true
          tags: ${{ env.IMAGE_HOOK }}:${{ env.BRANCH_NAME }}

      - name: Resolve image digests
        id: digest
        run: |
          DIGEST_APP=$(docker buildx imagetools inspect ${{ env.IMAGE_APP }}:${{ env.BRANCH_NAME }} | awk '/Digest:/ { print $2; exit }')
          DIGEST_HOOK=$(docker buildx imagetools inspect ${{ env.IMAGE_HOOK }}:${{ env.BRANCH_NAME }} | awk '/Digest:/ { print $2; exit }')
          
          echo "app_digest=${DIGEST_APP}" >> $GITHUB_OUTPUT
          echo "hook_digest=${DIGEST_HOOK}" >> $GITHUB_OUTPUT

      - name: Fix workspace permissions
        if: always()
        run: sudo chown -R $USER:$USER "$GITHUB_WORKSPACE" || true


  deploy:
    name: Deploy (Infra repo)
    runs-on: [self-hosted, linux, x64]
    needs: publish

    container:
      image: alpine/git
      env:
        BRANCH_NAME: ${{ env.BRANCH_NAME }}

    steps:
      - name: Determine target path
        id: envpath
        run: |
          case "${BRANCH_NAME}" in
            develop) ENV_PATH="agentes/stage/Requirements-AI" ;;
            *) echo "Branch não mapeada"; exit 1 ;;
          esac

          echo "env_path=${ENV_PATH}" >> $GITHUB_OUTPUT
          # Assumindo que o deploy é sempre comitando na branch develop da infra
          echo "target_branch=develop" >> $GITHUB_OUTPUT 

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_PUSH_TOKEN }}
          ref: ${{ steps.envpath.outputs.target_branch }}
          path: infra

      - name: Update deployment.yaml
        working-directory: infra/${{ steps.envpath.outputs.env_path }}
        env:
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          HOOK_DIGEST: ${{ needs.publish.outputs.hook_digest }}
          IMAGE_APP: ${{ env.IMAGE_APP }}
          IMAGE_HOOK: ${{ env.IMAGE_HOOK }}
        run: |
      
          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE_APP}@${APP_DIGEST}|" streamlit/deployment.yaml

          sed -i -E "s|^([[:space:]]*)image:.*|\1image: ${IMAGE_HOOK}@${HOOK_DIGEST}|" webhook/deployment.yaml

      - name: Commit and push changes
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "[DEPLOY] Requirements AI atualizado para ${BRANCH_NAME}" || echo "Nenhuma mudança"
          git push origin ${{ steps.envpath.outputs.target_branch }}